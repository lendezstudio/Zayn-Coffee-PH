<!DOCTYPE html>
<!--
  Zayn Coffee PH - social preview (Open Graph) image template, 1200x630.
  One photo (IMG_3618 -> assets/img/og/src-window-cacti.jpg, made by tools/optimize-images.ps1).
  No box or banner: small espresso-brown branding sits on the plain white pillar between the
  arched mirror and the window (centre of the frame, so square crops keep it), like wall signage.
  Render: powershell -ExecutionPolicy Bypass -File tools/make-og-image.ps1
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Work+Sans:wght@500;600&display=block" rel="stylesheet">
<style>
  *{ box-sizing: border-box; margin: 0; }
  html, body{ width: 1200px; height: 630px; overflow: hidden; }
  body{ position: relative; font-family: 'Work Sans', sans-serif; font-variation-settings: "opsz" 48; background: #F7F0E4; }
  .photo{ position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  /* the faintest warm lift on the pillar so the lettering sits cleanly; no visible edge */
  .lift{
    position: absolute; left: 404px; top: 150px; width: 210px; height: 330px;
    background: radial-gradient(ellipse at center, rgba(251,247,239,0.55) 0%, rgba(251,247,239,0) 70%);
  }
  .brand{
    position: absolute; left: 418px; width: 180px; top: 196px;
    display: flex; flex-direction: column; align-items: center; text-align: center; color: #241A12;
  }
  .brand img{ width: 52px; height: 52px; margin-bottom: 16px; }
  .name{ font-family: 'Fraunces', Georgia, serif; font-size: 40px; line-height: 1; letter-spacing: -0.01em; }
  .sub{ margin-top: 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.36em; padding-left: 0.36em; text-transform: uppercase; color: #9C4220; }
  .rule{ width: 34px; height: 1px; background: rgba(138,107,78,0.55); margin: 20px 0 16px; }
  .tag{ font-family: 'Fraunces', Georgia, serif; font-size: 15px; line-height: 1.35; color: #5C4C3D; }
</style>
</head>
<body>
  <img class="photo" src="../assets/img/og/src-window-cacti.jpg" alt="">
  <div class="lift"></div>
  <div class="brand">
    <img src="../assets/img/brand/zayn-mark.png" alt="">
    <p class="name">Zayn</p>
    <p class="sub">Coffee PH</p>
    <div class="rule"></div>
    <p class="tag">Good Coffee.<br>Local Specialty Coffee.</p>
  </div>
</body>
</html>

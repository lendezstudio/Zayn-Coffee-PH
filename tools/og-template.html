<!DOCTYPE html>
<!--
  Zayn Coffee PH - social preview (Open Graph) image template, 1200x630.
  Render it to assets/img/og/zayn-coffee-og.jpg with:
    powershell -ExecutionPolicy Bypass -File tools/make-og-image.ps1
  Real client photography carries the image: the sunny window table (IMG_3623)
  and a Zayn coffee by the window ("Cinnamon Lattè"). Branding is a small label
  only, kept off the photos' subjects so it still reads when the preview is small.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Work+Sans:wght@500;600&display=block" rel="stylesheet">
<style>
  *{ box-sizing: border-box; margin: 0; }
  html, body{ width: 1200px; height: 630px; overflow: hidden; }
  body{
    position: relative; background: #F7F0E4;
    font-family: 'Work Sans', sans-serif; color: #241A12;
    font-variation-settings: "opsz" 48;
  }
  .photo{ position: absolute; top: 0; bottom: 0; overflow: hidden; }
  .photo img{ width: 100%; height: 100%; object-fit: cover; display: block; }
  /* Cafe: sunny window table, rattan chairs, garden view */
  .cafe{ left: 0; width: 752px; }
  .cafe img{ object-position: 50% 62%; }
  /* Coffee: Zayn cup in window light */
  .coffee{ right: 0; width: 440px; }
  .coffee img{ object-position: 50% 58%; }

  /* Small brand label, bottom-left over the table edge (away from chairs and window) */
  .brand{
    position: absolute; left: 36px; bottom: 34px;
    display: flex; align-items: center; gap: 14px;
    padding: 14px 22px 14px 16px;
    background: rgba(247,240,228,0.94);
    border-radius: 999px;
    box-shadow: 0 18px 36px -22px rgba(36,26,18,0.55);
  }
  .brand img{ width: 46px; height: 46px; }
  .brand-name{ font-family: 'Fraunces', Georgia, serif; font-size: 30px; line-height: 1; letter-spacing: -0.01em; }
  .brand-place{
    margin-top: 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.26em;
    text-transform: uppercase; color: #9C4220;
  }
</style>
</head>
<body>
  <div class="photo cafe"><img src="../assets/img/gallery/window-table-rattan-960.jpg" alt=""></div>
  <div class="photo coffee"><img src="../assets/img/og/src-coffee-window-960.jpg" alt=""></div>
  <div class="brand">
    <img src="../assets/img/brand/zayn-mark.png" alt="">
    <div>
      <p class="brand-name">Zayn Coffee PH</p>
      <p class="brand-place">Hilongos, Leyte</p>
    </div>
  </div>
</body>
</html>

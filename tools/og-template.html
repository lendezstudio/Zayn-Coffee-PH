<!DOCTYPE html>
<!--
  Zayn Coffee PH - social preview (Open Graph) image template, 1200x630.
  One photo (IMG_3618, made by tools/optimize-images.ps1 as og/src-window-cacti.jpg)
  with a soft text overlay. Render to assets/img/og/zayn-coffee-og.jpg with:
    powershell -ExecutionPolicy Bypass -File tools/make-og-image.ps1
  Text sits bottom-left over a warm gradient so the arched mirror, window and
  cacti stay clear, and it still reads when platforms crop the preview to a square.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,350&family=Work+Sans:wght@500;600&display=block" rel="stylesheet">
<style>
  *{ box-sizing: border-box; margin: 0; }
  html, body{ width: 1200px; height: 630px; overflow: hidden; }
  body{ position: relative; font-family: 'Work Sans', sans-serif; font-variation-settings: "opsz" 48; }
  .photo{ position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  /* faint warm wash at the bottom so the card sits naturally */
  .wash{ position: absolute; inset: 0; background: linear-gradient(0deg, rgba(36,26,18,0.22) 0%, rgba(36,26,18,0) 40%); }
  /* frosted cream card, bottom-left */
  .text{
    position: absolute; left: 48px; bottom: 44px; color: #241A12;
    padding: 26px 34px 24px; border-radius: 18px;
    background: rgba(251,247,239,0.86);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    box-shadow: 0 24px 50px -28px rgba(36,26,18,0.55);
  }
  .brand{ display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .brand img{ width: 34px; height: 34px; }
  .brand span{ font-size: 13px; color: #9C4220; font-weight: 600; letter-spacing: 0.32em; text-transform: uppercase; }
  h1{
    font-family: 'Fraunces', Georgia, serif; font-weight: 400;
    font-size: 64px; line-height: 1; letter-spacing: -0.02em;
  }
  h1 em{ font-style: italic; font-weight: 350; color: #833511; }
  .rule{ width: 48px; height: 1px; background: rgba(138,107,78,0.6); margin: 16px 0 12px; }
  .place{ font-size: 12px; font-weight: 500; letter-spacing: 0.3em; text-transform: uppercase; color: #5C4C3D; }
</style>
</head>
<body>
  <img class="photo" src="../assets/img/og/src-window-cacti.jpg" alt="">
  <div class="wash"></div>
  <div class="text">
    <div class="brand"><img src="../assets/img/brand/zayn-mark.png" alt=""><span>Zayn Coffee PH</span></div>
    <h1>Good <em>Coffee.</em></h1>
    <div class="rule"></div>
    <p class="place">Hilongos, Leyte</p>
  </div>
</body>
</html>
